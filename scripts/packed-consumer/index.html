<!doctype html>
<html lang="en">
    <head>
        <meta charset="utf-8" />
        <title>UI components consumer</title>
    </head>
    <body>
        <gs-toolbar-fixture></gs-toolbar-fixture>
        <gs-native-select
            label="Reference"
            placeholder="Choose a reference"
        ></gs-native-select>
        <form class="gs-form" style="--gs-control-border: #123456">
            <label>Dataset name <input name="dataset" /></label>
        </form>
        <gs-multi-select aria-label="Find samples"></gs-multi-select>
        <gs-custom-select aria-label="Display mode"></gs-custom-select>
        <gs-threshold-comparison-input
            aria-label="Maximum reads"
            style="width: 400px"
        ></gs-threshold-comparison-input>
        <gs-data-grid
            aria-label="Import preview"
            style="height: 160px"
        ></gs-data-grid>
        <button id="open-dialog" type="button">Open dialog</button>
        <output id="dialog-result"></output>
        <button id="open-slotted" type="button">Open settings</button>
        <button id="show-slotted" type="button">
            Show settings nonmodally
        </button>
        <button id="close-slotted" type="button">Close settings</button>
        <div
            style="
                overflow: hidden;
                width: 24px;
                height: 24px;
                transform: translateZ(0);
                --gs-dialog-background: #edf3f8;
                --gs-basic-spacing: 12px;
                --gs-dialog-stroke-color: #789abc;
                --gs-theme-primary: #234567;
            "
        >
            <gs-dialog id="settings" dialog-title="Dataset settings">
                <form class="gs-form gs-dialog-layout" method="dialog">
                    <header><h2>Dataset settings</h2></header>
                    <section>
                        <label>
                            Display title
                            <input name="title" required autofocus />
                        </label>
                    </section>
                    <footer>
                        <button class="btn btn-primary" type="submit">
                            Done
                        </button>
                    </footer>
                </form>
            </gs-dialog>
        </div>
        <button id="open-menu" type="button" aria-haspopup="menu">
            Open menu
        </button>
        <gs-upload-drop-zone></gs-upload-drop-zone>
        <style>
            #custom-drop-zone::part(drop-zone) {
                min-block-size: 180px;
            }
        </style>
        <gs-upload-drop-zone id="custom-drop-zone">
            <gs-file-picker slot="picker" accept=".csv"
                >Choose sample files</gs-file-picker
            >
        </gs-upload-drop-zone>
        <output id="chosen-files"></output>
        <script type="module" src="./main.ts"></script>
    </body>
</html>
