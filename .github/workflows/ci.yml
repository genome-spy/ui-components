name: CI

on:
    pull_request:
    workflow_dispatch:
        inputs:
            browser_tests:
                description: Run headless packed-consumer browser tests
                type: boolean
                default: false
    push:
        branches: [main]

permissions:
    contents: read

jobs:
    check:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
              with:
                  persist-credentials: false
            - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
              with:
                  node-version: "24"
                  cache: npm
            - run: npm ci
            - run: npm run check
            - run: npm run test:packed-build
            - name: Install browser for explicitly requested acceptance
              if:
                  ${{ github.event_name == 'workflow_dispatch' &&
                  inputs.browser_tests }}
              run: npm exec -- playwright install --with-deps chromium
            - name: Run headless browser acceptance
              if:
                  ${{ github.event_name == 'workflow_dispatch' &&
                  inputs.browser_tests }}
              run: npm run test:packed-consumer
            - run: npm run build-storybook
              env:
                  STORYBOOK_DISABLE_TELEMETRY: "1"
