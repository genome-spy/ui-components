name: Release PR

on:
    push:
        branches: [main]
    workflow_dispatch:

permissions: {}

concurrency:
    group: release-pr
    cancel-in-progress: false

jobs:
    version:
        if:
            github.repository == 'genome-spy/ui-components' && github.ref ==
            'refs/heads/main'
        runs-on: ubuntu-latest
        permissions:
            contents: write
            pull-requests: write
        steps:
            - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
              with:
                  fetch-depth: 0
                  persist-credentials: false
            - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
              with:
                  node-version: "24"
                  package-manager-cache: false
            - run: npm ci
            - name: Open or update the release PR
              uses: changesets/action@ae32849d5ba541f9ae29e40e22a623bc13562f51 # v2.1.2
              with:
                  version-script: npm run release:version
                  commit-message: "chore: version UI Components"
                  pr-title: "chore: release UI Components"
